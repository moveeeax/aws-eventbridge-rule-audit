name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Test
        run: pytest -q

      - name: Audit the example fixtures
        run: |
          set +e
          aws-eventbridge-rule-audit \
            --input examples/rules.json \
            --targets examples/targets \
            --buses examples/buses.json \
            --archives examples/archives.json \
            --observed-sources examples/observed-sources.json \
            --format table
          code=$?
          set -e
          # the fixtures contain deliberate findings, so exit 1 is the expected result
          test "$code" -eq 1

      - name: A healthy bundle exits clean
        run: |
          printf '%s' '{"Rules":[{"Name":"ok","EventPattern":"{\"source\":[\"aws.ec2\"]}","State":"ENABLED"}],"Targets":{"ok":[{"Id":"t","Arn":"arn:aws:lambda:eu-west-1:1:function:t","DeadLetterConfig":{"Arn":"arn:aws:sqs:eu-west-1:1:dlq"},"RetryPolicy":{"MaximumRetryAttempts":4}}]}}' \
            | aws-eventbridge-rule-audit --input - --observed-sources aws.ec2
